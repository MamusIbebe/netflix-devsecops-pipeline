apiVersion: v1
kind: Service
metadata:
  name: netflix-app
  annotations:
    # EKS Auto Mode: create a public (internet-facing) Network Load Balancer
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  loadBalancerClass: eks.amazonaws.com/nlb
  selector:
    app: netflix-app
  ports:
    - port: 80
      targetPort: 80
