apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-app
  labels:
    app: netflix-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: netflix-app
  template:
    metadata:
      labels:
        app: netflix-app
    spec:
      # The image is built on an amd64 (x86) Jenkins server, so only run it on amd64 nodes.
      # Without this, a pod scheduled on an arm64 node crashes with "exec format error".
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: netflix-app
          image: <your-dockerhub-username>/netflix:latest   # CHANGE ME
          imagePullPolicy: Always
          ports:
            - containerPort: 80
